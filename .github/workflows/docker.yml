name: build-and-push
on: push
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker compose build
      - run: |
          for s in api location matcher simulator-alpha; do
            docker tag georide-$s ${{ secrets.DOCKERHUB_USERNAME }}/georide-$s
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/georide-$s
          done
